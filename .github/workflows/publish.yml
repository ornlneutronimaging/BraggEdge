name: packaging and publish

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - qa
      - next
    tags:
      - "v*"

# cancel previous job if new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for versioningit
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.62.0
          manifest-path: pyproject.toml
      - name: build PyPI package
        run: |
          echo "Build PyPI package"
          pixi run build
      - name: upload PyPI artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: pypi-package
          path: dist/*
      - name: publish PyPI package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1

  # Create GitHub Release with auto-generated release notes
  github-release:
    name: Create GitHub Release
    needs: linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download PyPI artifact
        uses: actions/download-artifact@v7
        with:
          name: pypi-package
          path: dist/pypi

      - name: List artifacts
        run: |
          echo "PyPI packages:"
          ls -la dist/pypi/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pypi/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
