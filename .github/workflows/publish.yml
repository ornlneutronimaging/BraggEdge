name: packaging and publish

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - qa
      - next
    tags:
      - "v*"

# cancel previous job if new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build and publish to PyPI
  build-pypi:
    name: Build PyPI Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for versioningit
      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: v0.71.2
          manifest-path: pyproject.toml
      - name: Build PyPI package
        run: pixi run build
      - name: Upload PyPI artifact
        uses: actions/upload-artifact@v7
        with:
          name: pypi-package
          path: dist/*

  publish-pypi:
    name: Publish to PyPI
    needs: build-pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/neutronbraggedge
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - name: Download PyPI artifact
        uses: actions/download-artifact@v8
        with:
          name: pypi-package
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Build and publish to Conda
  build-conda:
    name: Build Conda Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for versioningit
      - name: Get version from tag or versioningit
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix
          else
            pip install versioningit
            VERSION=$(versioningit .)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"
      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict
      - name: Install conda-build
        # Install into base: `conda build` is a base-env subcommand plugin,
        # resolved from the env where conda itself runs (base) — not the
        # auto-activated `test` env where `conda install` would land it.
        shell: bash -el {0}
        run: conda install -y -n base conda-build anaconda-client
      - name: Build Conda package
        shell: bash -el {0}
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          conda build conda.recipe --output-folder conda-bld
          ls -la conda-bld/noarch/
      - name: Upload Conda artifact
        uses: actions/upload-artifact@v7
        with:
          name: conda-package
          path: conda-bld/noarch/*.tar.bz2

  publish-conda:
    name: Publish to Anaconda.org
    needs: build-conda
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: "3.11"
      - name: Install anaconda-client
        shell: bash -el {0}
        run: conda install -y anaconda-client
      - name: Download Conda artifact
        uses: actions/download-artifact@v8
        with:
          name: conda-package
          path: conda-pkg
      - name: Determine label
        id: label
        run: |
          if [[ "${{ github.ref_name }}" == *"rc"* ]] || [[ "${{ github.ref_name }}" == *"alpha"* ]] || [[ "${{ github.ref_name }}" == *"beta"* ]]; then
            echo "label=rc" >> $GITHUB_OUTPUT
          else
            echo "label=main" >> $GITHUB_OUTPUT
          fi
      - name: Upload to Anaconda.org
        shell: bash -el {0}
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          anaconda -t $ANACONDA_TOKEN upload \
            --user neutronimaging \
            --label ${{ steps.label.outputs.label }} \
            conda-pkg/*.tar.bz2

  # Create GitHub Release with auto-generated release notes
  github-release:
    name: Create GitHub Release
    needs: [build-pypi, build-conda]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download PyPI artifact
        uses: actions/download-artifact@v8
        with:
          name: pypi-package
          path: dist/pypi

      - name: Download Conda artifact
        uses: actions/download-artifact@v8
        with:
          name: conda-package
          path: dist/conda

      - name: List artifacts
        run: |
          echo "PyPI packages:"
          ls -la dist/pypi/
          echo "Conda packages:"
          ls -la dist/conda/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/pypi/*
            dist/conda/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
