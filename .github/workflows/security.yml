name: security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - qa
      - next
  schedule:
    # Weekly (Mon 06:00 UTC) so newly-disclosed CVEs in unchanged deps still surface.
    - cron: "0 6 * * 1"

# cancel previous job if new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grype-scan:
    name: Grype vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip on fork PRs: their GITHUB_TOKEN is read-only, so the SARIF upload
    # (needs security-events: write) would 403 and fail the job for external
    # contributors. Pushes, schedule, dispatch, and same-repo PRs still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read          # for actions/checkout
      security-events: write  # for upload-sarif to upload results to code scanning
      actions: read           # for upload-sarif to read run status (private repos)
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.71.2
          manifest-path: pyproject.toml
          run-install: false
      # Install only the runtime-only environment (no test/dev tooling) so Grype
      # scans the closure that actually ships to users — matching the org
      # reference's "scan the shipped package" intent and keeping the alert list
      # to actionable runtime CVEs. Grype catalogs both the conda packages
      # (conda-meta) and the PyPI packages (site-packages) in the prefix.
      - name: Install runtime environment
        run: pixi install --locked --environment runtime
      - name: Scan installed environment with Grype
        uses: neutrons/conda-actions/grype@v2
        with:
          path: .pixi/envs/runtime
