version: 2
updates:
  # Update GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "next"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  # Update pip dependencies (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    target-branch: "next"
    # Only raise a dependency's >= floor when the current floor actually
    # excludes the latest version. Stops gratuitous minimum-version bumps
    # (the source of the #66-73 churn); pixi.lock movement is handled by the
    # update-lockfiles cron, and security updates still bump when needed.
    versioning-strategy: increase-if-necessary
    labels:
      - "dependencies"
      - "python"
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
