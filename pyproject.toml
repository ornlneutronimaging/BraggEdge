[project]
name = "neutronbraggedge"
description = "Bragg Edge calculations for neutron imaging"
readme = "README.md"
authors = [
  {name = "Jean Bilheux", email = "bilheuxjm@ornl.gov"},
]
maintainers = [
  {name = "Jean Bilheux", email = "bilheuxjm@ornl.gov"},
  {name = "Chen Zhang", email = "zhangc@ornl.gov"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
  "Intended Audience :: Science/Research",
]
dynamic = ["version"]
requires-python = ">=3.11,<3.13"
license = "BSD-3-Clause"
keywords = ["Bragg Edge", "neutron", "imaging", "crystallography", "diffraction"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "lxml>=4.9",
  "beautifulsoup4>=4.12",
  "html5lib>=1.1",
  "pydantic>=2.0",
  "loguru>=0.7",
  # Note: configparser is stdlib in Python 3, no longer needed as dependency
]

[project.urls]
homepage = "https://github.com/ornlneutronimaging/BraggEdge"
documentation = "https://braggedge.readthedocs.io/"
"Bug Tracker" = "https://github.com/ornlneutronimaging/BraggEdge/issues"
"Source Code" = "https://github.com/ornlneutronimaging/BraggEdge"

[build-system]
requires = [
  "setuptools>=61.0",
  "wheel",
  "versioningit>=3.0",
]
build-backend = "setuptools.build_meta"

# Automatic versioning from git tags
[tool.versioningit.vcs]
method = "git"
default-tag = "2.0.5"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{next_version}.dev{distance}"
dirty = "{version}+d{build_date:%Y%m%d}"
distance-dirty = "{next_version}.dev{distance}+d{build_date:%Y%m%d%H%M}"

[tool.versioningit.write]
file = "src/neutronbraggedge/_version.py"

# Package discovery
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "docs*", "notebooks*"]

[tool.setuptools.package-data]
"*" = ["*.cfg", "*.dat", "data/*.dat"]

# pytest configuration
[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test*.py", "*_test.py"]
norecursedirs = [".git", "tmp*", "_tmp*", "__pycache__"]
markers = [
  "unit: unit tests",
  "integration: integration tests",
  "slow: tests that are slow to run",
]

# Coverage configuration
[tool.coverage.run]
branch = true
source = ["src/neutronbraggedge"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

# Ruff configuration
[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["notebooks/**", "**/*.ipynb", "docs/_build/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "D"]
ignore = [
  "E701",  # Multiple statements on one line (colon) - existing code style, fix in #22
  "E722",  # Bare except - existing code, fix in #22
  "E741",  # Ambiguous variable name (l) - h,k,l are standard Miller indices notation
  "UP031", # Use format specifiers instead of percent format - fix in #22
  # Docstring rules - will be fixed in PR3 (#56)
  "D100",  # Missing docstring in public module
  "D101",  # Missing docstring in public class
  "D102",  # Missing docstring in public method
  "D103",  # Missing docstring in public function
  "D104",  # Missing docstring in public package
  "D105",  # Missing docstring in magic method
  "D107",  # Missing docstring in __init__
  "D200",  # One-line docstring should fit on one line
  "D202",  # No blank lines allowed after function docstring
  "D205",  # 1 blank line required between summary and description
  "D209",  # Multi-line docstring closing quotes should be on separate line
  "D400",  # First line should end with a period
  "D401",  # First line should be in imperative mood
  "D403",  # First word of docstring should be capitalized
  "D404",  # First word of docstring should not be "This"
  "D406",  # Section name should end with a newline
  "D407",  # Missing dashed underline after section
  "D410",  # Missing blank line after section
  "D411",  # Missing blank line before section
  "D412",  # No blank lines allowed between section header and content
  "D414",  # Section has no content
  "D415",  # First line should end with period, question mark, or exclamation point
  "D417",  # Missing argument descriptions in docstring
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["neutronbraggedge"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# Pixi configuration
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "osx-64"]

[tool.pixi.pypi-dependencies]
neutronbraggedge = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.11,<3.13"
numpy = ">=1.24"
pandas = ">=2.0"
lxml = ">=4.9"
beautifulsoup4 = ">=4.12"
html5lib = ">=1.1"
pydantic = ">=2.0"
loguru = ">=0.7"

[tool.pixi.tasks]
# Testing
test = "pytest tests --cov-branch --cov=src/neutronbraggedge --cov-report=term --cov-report=xml"
test-fast = "pytest tests -x"
# Linting & Formatting
lint = "ruff check src tests"
format = "ruff format src tests"
pre-commit = "pre-commit run --all-files"
pre-commit-install = "pre-commit install"
# Building
build = "python -m build"
# Cleanup
clean = {depends-on = ["rm_build", "rm_test"]}
rm_build = "rm -rf dist/ build/ src/*.egg-info/"
rm_test = "rm -rf .coverage .pytest_cache coverage.xml htmlcov/"

[tool.pixi.feature.test.dependencies]
pytest = ">=7.0"
pytest-cov = "*"

[tool.pixi.feature.dev.dependencies]
pip = "*"
versioningit = ">=3.0"
pre-commit = "*"
ruff = "*"
python-build = "*"

[tool.pixi.feature.docs.dependencies]
sphinx = ">=7.0"
sphinx-rtd-theme = "*"
myst-parser = "*"

[tool.pixi.environments]
default = {features = ["test", "dev"], solve-group = "default"}
docs = {features = ["docs"], solve-group = "default"}
# Runtime-only closure (no test/dev features) — what actually ships to users.
# Shares the default solve-group so versions match the locked set exactly.
# Used by the security workflow so Grype scans only shipped deps, not dev tooling.
runtime = {features = [], solve-group = "default"}
